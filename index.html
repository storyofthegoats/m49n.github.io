<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>m49n</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html {
        background: #050505;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: start center;
        overflow-x: hidden;
        background: #050505;
      }

      .artwork-map {
        position: relative;
        width: min(100vw, calc(100svh * 2 / 3));
        aspect-ratio: 2 / 3;
        flex: none;
      }

      .artwork-map > img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .hotspot {
        position: absolute;
        display: block;
        z-index: 1;
        color: transparent;
        background: transparent;
        border: 0;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .hotspot:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      .hotspot-japanese-pokemon {
        left: 15%;
        top: 5%;
        width: 69%;
        height: 18%;
      }

      .hotspot-tyranitar {
        left: 42%;
        top: 24%;
        width: 39%;
        height: 23%;
      }

      .hotspot-cardboard {
        left: 17%;
        top: 51%;
        width: 44%;
        height: 20%;
      }

      .hotspot-mlb-rosters {
        left: 52%;
        top: 76%;
        width: 42%;
        height: 21%;
      }

      @media (min-aspect-ratio: 2 / 3) {
        body {
          place-items: center;
        }
      }

      @media (forced-colors: active) {
        .hotspot:focus-visible {
          outline-color: LinkText;
        }
      }
    </style>
  </head>
  <body>
    <main class="artwork-map">
      <img
        src="images/Corocoro1.webp"
        alt="Japanese manga-style Pokémon collage centered on Tyranitar"
        width="1024"
        height="1536"
        decoding="async"
        fetchpriority="high"
      />

      <nav aria-label="Site destinations">
        <a
          class="hotspot hotspot-japanese-pokemon"
          href="japanese-pokemon.html"
          aria-label="Vintage Japanese Pokémon set guides"
        ></a>
        <a
          class="hotspot hotspot-tyranitar"
          href="tyranitar.html"
          aria-label="Tyranitar tribute"
        ></a>
        <a
          class="hotspot hotspot-cardboard"
          href="cards.html"
          aria-label="Sports card collection lists"
        ></a>
        <a
          class="hotspot hotspot-mlb-rosters"
          href="mlb-rosters.html"
          aria-label="MLB team rosters by year"
        ></a>
      </nav>
    </main>
  </body>
</html>
